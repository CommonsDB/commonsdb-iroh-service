name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p registryd -p storectl
      - name: Package
        run: |
          mkdir -p dist
          tar -czf "dist/registryd-${{ matrix.target }}.tar.gz" -C target/release registryd
          tar -czf "dist/storectl-${{ matrix.target }}.tar.gz" -C target/release storectl
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
