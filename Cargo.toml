[workspace]
resolver = "2"
members = [
    "crates/registry-core",
    "crates/registry-node",
    "crates/registryd",
    "crates/registry-viewer",
    "crates/storectl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/commonsdb/commonsdb-iroh-service"

[workspace.dependencies]
registry-core = { path = "crates/registry-core" }
registry-node = { path = "crates/registry-node" }

iroh = "1.0.1"
iroh-blobs = "0.103.0"
iroh-docs = { version = "0.101.0", features = ["fs-store"] }
iroh-gossip = "0.101.0"

tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
blake3 = "1"
sha2 = "0.10"
cid = "0.11"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
async-trait = "0.1"
rand = "0.8"
hex = "0.4"
dirs = "5"
toml = "0.8"
redb = "2"
n0-future = "0.3"
dotenvy = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
